[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Calibrate LLM judges against human labels, measure score stability, run counterfactual invariance tests, and catch regressions between prompt versions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Al Alif Akash" }]
keywords = ["llm", "evaluation", "llm-as-a-judge", "rubric", "agents"]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/akash-decoder/llm-eval-harness"
Issues = "https://github.com/akash-decoder/llm-eval-harness/issues"

[project.scripts]
llm-eval = "llm_eval_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic", "openai"]
ignore_missing_imports = true
